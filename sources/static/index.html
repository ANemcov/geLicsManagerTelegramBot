<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Grotem WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    label, select, input, button {
      display: block;
      margin: 10px 0;
      width: 100%;
      font-size: 16px;
    }
    #output {
      white-space: pre-wrap;
      margin-top: 20px;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
    }
    #loader {
      margin: 10px 0;
      font-size: 16px;
      color: #888;
    }
  </style>
</head>
<body>
  <h2>Управление лицензиями</h2>

  <div id="loader">Загрузка списка решений...</div>

  <label for="solution_select">Выберите решение:</label>
  <select id="solution_select" disabled>
    <option>— загрузка... —</option>
  </select>

  <label>Новое количество лицензий:</label>
  <input type="number" id="lic_count" value="5">

  <button onclick="getLicInfo()">Показать лицензии</button>
  <button onclick="resetLic()">Сбросить лицензии</button>
  <button onclick="setLic()">Установить лицензии</button>

  <div id="output">...</div>

  <script>
    const tg = window.Telegram.WebApp;

    if (!tg.initData || tg.initData.length === 0) {
      document.body.innerHTML = "<h2>Доступ только через Telegram</h2><p>Откройте бота в Telegram, чтобы использовать WebApp.</p>";
      throw new Error("Not running inside Telegram WebApp");
    }

    const initData = tg.initData;
    tg.expand();

    const solutionSelect = document.getElementById("solution_select");
    const loader = document.getElementById("loader");
    const licCountInput = document.getElementById("lic_count");

    solutionSelect.addEventListener("change", async () => {
      const sn = solutionSelect.value;
      if (!sn) {
        licCountInput.value = "";
        return;
      }
    
      try {
        const res = await fetch(`/api/solutions/${sn}/licenses`, {
          headers: {
            'X-Telegram-InitData': initData
          }
        });
    
        if (!res.ok) {
          output(`Ошибка загрузки лицензий: ${res.status} ${res.statusText}`);
          licCountInput.value = "";
          return;
        }
    
        const data = await res.json();
        // Подставляем TotalLicenses в поле input
        if (typeof data.TotalLicenses === "number") {
          licCountInput.value = data.TotalLicenses;
        } else {
          licCountInput.value = "";
          output("Данные о лицензиях отсутствуют или некорректны");
        }
    
        // Также можно вывести информацию о лицензиях
        output(JSON.stringify(data, null, 2));
      } catch (err) {
        output(`Ошибка запроса лицензий: ${err.message}`);
        licCountInput.value = "";
      }
    });

    function output(text) {
      document.getElementById("output").textContent = text;
    }

    async function fetchSolutions() {
      try {
        const res = await fetch("/api/solutions", {
          headers: {
            'X-Telegram-InitData': initData
          }
        });
        const text = await res.text();

        try {
          const solutions = JSON.parse(text);
          loader.style.display = "none";
          solutionSelect.innerHTML = ""; // очищаем список

          if (Array.isArray(solutions) && solutions.length > 0) {
            solutions.forEach(name => {
              const opt = document.createElement("option");
              opt.value = name;
              opt.textContent = name;
              solutionSelect.appendChild(opt);
            });
            solutionSelect.disabled = false;
          } else {
            const opt = document.createElement("option");
            opt.textContent = "Нет доступных решений";
            solutionSelect.appendChild(opt);
          }

        } catch (err) {
          loader.textContent = "Ошибка загрузки списка решений";
          solutionSelect.innerHTML = "";
          const opt = document.createElement("option");
          opt.textContent = "— ошибка —";
          solutionSelect.appendChild(opt);
        }
      } catch (e) {
        loader.textContent = "Ошибка сети при загрузке решений";
        solutionSelect.innerHTML = "";
        const opt = document.createElement("option");
        opt.textContent = "— ошибка —";
        solutionSelect.appendChild(opt);
      }
    }

    function getSelectedSolution() {
      return solutionSelect.value;
    }

    async function getLicInfo() {
      const sn = getSelectedSolution();
      const res = await fetch(`/api/solutions/${sn}/licenses`, {
        headers: {
          'X-Telegram-InitData': initData
        }
      });
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        output(JSON.stringify(data, null, 2));
      } catch (e) {
        output("Ошибка парсинга ответа: " + e.message + "\n" + text);
      }
    }

    async function resetLic() {
      const sn = getSelectedSolution();
      const res = await fetch(`/api/solutions/${sn}/reset`, {
        method: "POST",
        headers: {
          'X-Telegram-InitData': initData
        }
      });
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        output(JSON.stringify(data, null, 2));
      } catch (e) {
        output("Ошибка парсинга ответа: " + e.message + "\n" + text);
      }
    }

    async function setLic() {
      const sn = getSelectedSolution();
      const count = document.getElementById("lic_count").value;
      const res = await fetch(`/api/solutions/${sn}/set/${count}`, {
        method: "POST",
        headers: {
          'X-Telegram-InitData': initData
        }
      });
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        output(JSON.stringify(data, null, 2));
      } catch (e) {
        output("Ошибка парсинга ответа: " + e.message + "\n" + text);
      }
    }

    fetchSolutions(); // загрузка решений при старте
  </script>
</body>
</html>
