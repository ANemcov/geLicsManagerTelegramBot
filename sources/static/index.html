<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Grotem WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    label, select, input, button {
      display: block;
      margin: 10px 0;
      width: 100%;
      font-size: 16px;
    }
    #output {
      white-space: pre-wrap;
      margin-top: 20px;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h2>Управление лицензиями</h2>

  <label>Название решения:</label>
  <input type="text" id="solution_name" placeholder="например, demo">

  <label>Новое количество лицензий:</label>
  <input type="number" id="lic_count" value="5">

  <button onclick="getLicInfo()">Показать лицензии</button>
  <button onclick="resetLic()">Сбросить лицензии</button>
  <button onclick="setLic()">Установить лицензии</button>

  <div id="output">...</div>

  <script>
    const tg = window.Telegram.WebApp;

    if (!tg.initData || tg.initData.length === 0) {
        // WebApp не был открыт из Telegram
        document.body.innerHTML = "<h2>Доступ только через Telegram</h2><p>Откройте бота в Telegram, чтобы использовать WebApp.</p>";
        throw new Error("Not running inside Telegram WebApp");
    }

    const initData = tg.initData;

    tg.expand(); // разворачивает WebApp

    function getSolutionName() {
      return document.getElementById("solution_name").value.trim();
    }

    function output(text) {
      document.getElementById("output").textContent = text;
    }

    async function getLicInfo() {
      const sn = getSolutionName();
      const res = await fetch(`/api/solutions/${sn}/licenses`);
      const data = await res.json();
      output(JSON.stringify(data, null, 2));
    }

    async function resetLic() {
      const sn = getSolutionName();
      const res = await fetch(
        `/api/solutions/${sn}/reset`, 
        { 
            method: "POST",
            headers: {
                'X-Telegram-InitData': initData
            }
        }
    );
      const data = await res.json();
      output(JSON.stringify(data, null, 2));
    }

    async function setLic() {
      const sn = getSolutionName();
      const count = document.getElementById("lic_count").value;
      const res = await fetch(
        `/api/solutions/${sn}/set/${count}`,
        { 
            method: "POST",
            headers: {
                'X-Telegram-InitData': initData
            }
        }
    );
      const data = await res.json();
      output(JSON.stringify(data, null, 2));
    }
  </script>
</body>
</html>
